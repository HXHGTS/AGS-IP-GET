name: Mihomo AGS Hosts rule

on:
  push:
    branches:
      - main
  schedule:
    # Daily probe; the cadence gate enforces the real 30-day interval.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 30-day cadence gate
        id: gate
        run: |
          D=$(( $(date -u +%s) / 86400 ))
          A=20741
          if [ "$D" -ge "$A" ] && [ $(( (D - A) % 30 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cadence HIT: 30-day cycle, epoch day $D"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cadence MISS: 30-day cycle, epoch day $D -> skipping real work"
          fi

  AGS-Hosts-Generate:
    needs: cadence
    if: github.event_name != 'schedule' || needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Necessary Tools
        run: |
          sudo apt install -y curl wget sed git

      - name: Install Mihomo Core
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v2-v1.19.27.deb
          sudo dpkg -i mihomo-linux-amd64-v2-v1.19.27.deb
          sudo rm -f mihomo-linux-amd64-v2-v1.19.27.deb

      - name: Download Yml
        run: |
          echo 'payload:' > GetAdobeHosts.yml
          curl -fsSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:144.0) Gecko/20100101 Firefox/144.0' 'https://a.dove.isdumb.one/list.txt'| grep 0.0.0.0 | sed 's/0.0.0.0 /  - DOMAIN,/g' >> GetAdobeHosts.yml

      - name: Convert to mrs
        run: |
          mihomo convert-ruleset domain yaml GetAdobeHosts.yml GetAdobeHosts.mrs

      - name: Configure Git User
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Prepare Data Folder
        run: |
          sudo mkdir -p data
          sudo mv -f GetAdobeHosts.yml data
          sudo mv -f GetAdobeHosts.mrs data
          sudo chown -R $USER:$USER data
          sudo chmod -R 755 data

      - name: Push Files
        run: |
          echo "Force updating repository with local content. . ."
          git checkout -b Release
          sudo git add data
          git commit -m "Update Adobe hosts data"
          git push --force origin Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
